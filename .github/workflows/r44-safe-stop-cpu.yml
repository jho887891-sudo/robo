name: R44 Safe Stop CPU Tests

on:
  push:
    branches:
      - experiment/r44-trainer-implementation-20261026
      - audit/r44-strict-transition-contract-20261027
    paths:
      - "training/r44_safe_stop.py"
      - "training/r44_train.py"
      - "diagnostics/r44_gpu_smoke.py"
      - "tests/test_r44_train_core.py"
      - "tests/test_r44_safe_stop.py"
      - ".github/workflows/r44-safe-stop-cpu.yml"
  pull_request:
    paths:
      - "training/r44_safe_stop.py"
      - "training/r44_train.py"
      - "training/r44_delta_v1.py"
      - "diagnostics/r44_gpu_smoke.py"
      - "tests/test_r44_train_core.py"
      - "tests/test_r44_safe_stop.py"
      - "tests/test_r44_delta_v1.py"
      - ".github/workflows/r44-safe-stop-cpu.yml"

permissions:
  contents: read

jobs:
  safe-stop-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install NumPy for image-loader unit test
        run: python -m pip install numpy
      - name: Compile R44 training modules
        run: python -m py_compile training/r44_train.py training/r44_safe_stop.py training/r44_delta_v1.py diagnostics/r44_gpu_smoke.py
      - name: Run R44 CPU contract tests
        run: |
          python -m unittest discover -s tests -p "test_r44_safe_stop.py" -v
          python -m unittest discover -s tests -p "test_r44_train_core.py" -v
          python -m unittest discover -s tests -p "test_r44_delta_v1.py" -v
