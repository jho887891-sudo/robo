name: R44 Safe Stop CPU Tests

on:
  push:
    branches:
      - experiment/r44-trainer-implementation-20261026
    paths:
      - "training/r44_safe_stop.py"
      - "tests/test_r44_safe_stop.py"
      - ".github/workflows/r44-safe-stop-cpu.yml"
  pull_request:
    paths:
      - "training/r44_safe_stop.py"
      - "tests/test_r44_safe_stop.py"
      - ".github/workflows/r44-safe-stop-cpu.yml"

permissions:
  contents: read

jobs:
  safe-stop-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run safe-stop CPU tests
        run: python -m unittest discover -s tests -p "test_r44_safe_stop.py" -v
