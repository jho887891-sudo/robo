name: R25 M2 deployment D0-A CPU contract

on:
  push:
    branches:
      - fix/r25-m2-deployment-contract
  pull_request:
    paths:
      - 'code/xpolicylab/policy/OpenVLA_R42/m2_deploy_contract.py'
      - 'tests/test_r25_m2_deploy_contract.py'
      - 'tests/test_r25_m2_deploy_server.py'
      - 'tests/test_r25_m2_model_integration.py'
      - 'docs/superpowers/specs/2026-10-22-r25-m2-deploy-boundary-design.md'
      - '.github/workflows/r25-m2-contract.yml'
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU dependencies only
        run: |
          python -m pip install numpy==1.26.4 pytest==8.3.5
      - name: Test real two-task normalizer and checkpoint preflight
        run: |
          pytest -q tests/test_r25_m2_deploy_contract.py tests/test_r25_m2_deploy_server.py tests/test_r25_m2_model_integration.py
      - name: Verify legacy R42 metadata regression suite
        run: |
          pytest -q tests/test_r42_m2_normalizer.py tests/test_r42_metadata_bridge.py tests/test_r11_p0_metadata.py
