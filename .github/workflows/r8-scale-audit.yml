name: R8 Motion Scale Audit
on:
  push:
    branches:
      - audit/r8-proprio-scale-preflight
  pull_request:
    paths:
      - 'diagnostics/r8_scale_audit.py'
      - 'tests/test_r8_scale_audit.py'
      - 'report/R8_CHATGPT_SCALE_AUDIT.md'
      - '.github/workflows/r8-scale-audit.yml'
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy==1.26.4
      - run: python -m py_compile diagnostics/r8_scale_audit.py tests/test_r8_scale_audit.py
      - run: python tests/test_r8_scale_audit.py
