name: R6 Oracle Contract Audit
on:
  push:
    branches:
      - audit/r6-oracle-claim-correction
  pull_request:
    paths:
      - 'diagnostics/r6_representable_oracle.py'
      - 'diagnostics/r6_history_ceiling.py'
      - 'tests/test_r6_representable_oracle.py'
      - 'report/R6_AUDIT_CORRECTIONS.md'
      - '.github/workflows/r6-oracle-audit.yml'
jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy==1.26.4
      - name: Compile audit source
        run: |
          python -m py_compile diagnostics/r6_representable_oracle.py diagnostics/r6_history_ceiling.py
          python -m py_compile tests/test_r6_representable_oracle.py
      - name: Test best-bin mathematical contract on synthetic inputs
        run: python tests/test_r6_representable_oracle.py
