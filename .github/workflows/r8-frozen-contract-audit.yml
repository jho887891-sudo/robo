name: R8 Frozen Contract Audit
on:
  push:
    branches:
      - review/r8-three-lane-contract-audit
  pull_request:
    paths:
      - 'tools/make_frozen_contract.py'
      - 'diagnostics/r8_smoke.py'
      - 'tests/test_r8_frozen_metadata_audit.py'
      - '.github/workflows/r8-frozen-contract-audit.yml'
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy==1.26.4 h5py
      - run: python -m py_compile tools/make_frozen_contract.py diagnostics/r8_smoke.py tests/test_r8_frozen_metadata_audit.py
      - run: python tests/test_r8_frozen_metadata_audit.py
