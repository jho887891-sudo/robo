name: R45 Runtime CPU Gate
on:
  pull_request:
    paths:
      - 'training/r44_train.py'
      - 'training/r45_train.py'
      - 'training/r45_data.py'
      - 'training/r45_contract.py'
      - 'diagnostics/r45_gpu_bench.py'
      - 'tests/test_r45_runtime_gate.py'
      - '.github/workflows/r45-runtime-cpu.yml'
  workflow_dispatch:
jobs:
  runtime-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Minimal CPU dependency
        run: python -m pip install --disable-pip-version-check "numpy>=1.26,<3"
      - name: Syntax check
        run: python -m py_compile training/r44_train.py training/r45_data.py training/r45_train.py training/r45_contract.py diagnostics/r45_gpu_bench.py tests/test_r45_runtime_gate.py
      - name: Regression gate (no CUDA, no HDF5 dataset)
        run: python -m unittest discover -s tests -p 'test_r45_runtime_gate.py' -v
